# Updates arrive as pull requests, which CI checks like any other change.
# Weekly rather than daily: a wall of pull requests on a Monday gets ignored,
# and being ignored is how a security update sits unmerged for a month.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Dar_es_Salaam
    open-pull-requests-limit: 5
    groups:
      # One pull request for the things that always move together, so a Next
      # or a Prisma bump is reviewed as the single change it really is.
      next:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      nest:
        patterns: ['@nestjs/*']
      dev:
        dependency-type: development
    labels: ['dependencies']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: ['dependencies']
